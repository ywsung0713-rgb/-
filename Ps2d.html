<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>끝말잇기 도우미</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d14;
    --surface: #13131e;
    --card: #1c1c2e;
    --border: #2e2e50;
    --accent: #6c63ff;
    --accent2: #ff6b9d;
    --accent3: #43e8d8;
    --text: #eeeef8;
    --muted: #6060a0;
    --success: #43e88a;
    --warn: #f7c948;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 16px 80px;
    overflow-x: hidden;
  }
  .glow-orb { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(80px); opacity: 0.18; }
  .glow-orb.a { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; }
  .glow-orb.b { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; }
  .header { text-align: center; margin-bottom: 36px; animation: fadeDown 0.6s cubic-bezier(.22,1,.36,1); }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.35); color: #a89fff; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 5px 14px; border-radius: 20px; margin-bottom: 18px; text-transform: uppercase; }
  .header h1 { font-family: 'Black Han Sans', sans-serif; font-size: clamp(36px, 7vw, 60px); background: linear-gradient(135deg, #fff 20%, var(--accent) 55%, var(--accent2) 90%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; margin-bottom: 10px; }
  .header p { color: var(--muted); font-size: 13px; }
  .card { width: 100%; max-width: 700px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 28px 32px; margin-bottom: 20px; animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1); }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
  .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .word-input { flex: 1; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px 20px; font-size: 22px; font-family: 'Black Han Sans', sans-serif; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s; letter-spacing: 3px; }
  .word-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,99,255,0.15); }
  .word-input::placeholder { color: var(--muted); font-size: 15px; letter-spacing: 1px; font-family: 'Noto Sans KR'; }
  .search-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 14px; padding: 0 26px; font-size: 22px; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; flex-shrink: 0; }
  .search-btn:hover { transform: scale(1.06); box-shadow: 0 6px 24px rgba(108,99,255,0.45); }
  .search-btn:active { transform: scale(0.96); }
  .target-bar { display: none; align-items: center; gap: 14px; padding: 12px 18px; background: var(--card); border-radius: 12px; border-left: 4px solid var(--accent); }
  .target-bar.on { display: flex; animation: fadeUp 0.3s ease; }
  .char-pill { width: 50px; height: 50px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Black Han Sans', sans-serif; font-size: 26px; flex-shrink: 0; box-shadow: 0 4px 16px rgba(108,99,255,0.4); }
  .target-info .main { font-size: 15px; font-weight: 700; color: var(--text); }
  .target-info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .results-section { display: none; }
  .results-section.on { display: block; animation: fadeUp 0.35s ease; }
  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .result-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .result-count { font-size: 12px; color: var(--success); font-weight: 700; }
  .words-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .word-chip { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 13px 14px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; user-select: none; }
  .word-chip:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(108,99,255,0.2); }
  .word-chip:active { transform: translateY(0); }
  .word-chip.selected { border-color: var(--accent3); background: rgba(67,232,216,0.07); }
  .chip-word { font-family: 'Black Han Sans', sans-serif; font-size: 19px; display: block; margin-bottom: 5px; letter-spacing: 1px; }
  .chip-word .fc { color: var(--accent); }
  .chip-word .lc { color: var(--accent2); }
  .chip-next { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .chip-next .arrow-tag { background: rgba(255,107,157,0.18); color: var(--accent2); border-radius: 5px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
  .empty-box { display: none; text-align: center; padding: 36px 20px; color: var(--muted); }
  .empty-box.on { display: block; animation: fadeUp 0.3s ease; }
  .empty-box .emoji { font-size: 36px; margin-bottom: 10px; }
  .empty-box .msg { font-size: 14px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .history-chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 36px; }
  .h-word { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; font-family: 'Black Han Sans', sans-serif; font-size: 15px; color: var(--text); animation: pop 0.25s cubic-bezier(.22,1,.36,1); }
  .h-word:last-child { border-color: var(--accent3); color: var(--accent3); }
  .h-arrow { color: var(--muted); font-size: 14px; }
  .h-empty { color: var(--muted); font-size: 13px; }
  .clear-btn { font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans KR'; }
  .clear-btn:hover { color: var(--accent2); border-color: var(--accent2); }
  .stat-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .stat-item { font-size: 12px; color: var(--muted); }
  .stat-item span { color: var(--warn); font-weight: 700; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div class="header">
  <div class="badge">✦ 오프라인 도우미</div>
  <h1>끝말잇기<br>단어 찾기</h1>
  <p>단어 또는 글자를 입력하면 이어갈 수 있는 단어를 추천해드립니다</p>
</div>
<div class="card">
  <label class="label">단어 또는 글자 입력</label>
  <div class="input-row">
    <input class="word-input" id="wordInput" type="text" placeholder="예) 가속도 또는 도" autocomplete="off" spellcheck="false">
    <button class="search-btn" id="searchBtn">🔍</button>
  </div>
  <div class="target-bar" id="targetBar">
    <div class="char-pill" id="charPill">?</div>
    <div class="target-info">
      <div class="main" id="targetMain">검색 결과</div>
      <div class="sub" id="targetSub">끝 글자 기준으로 추천</div>
    </div>
  </div>
  <div style="margin-top:18px">
    <div class="results-section" id="resultsSection">
      <div class="result-header">
        <span class="result-title">추천 단어</span>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="words-grid" id="wordsGrid"></div>
    </div>
    <div class="empty-box" id="emptyBox">
      <div class="emoji">🤔</div>
      <div class="msg" id="emptyMsg">해당 글자로 시작하는 단어가 없습니다</div>
    </div>
  </div>
</div>
<div class="card">
  <div class="history-header">
    <span class="label" style="margin:0">🔗 이어진 단어 기록</span>
    <button class="clear-btn" id="clearBtn">초기화</button>
  </div>
  <div class="history-chain" id="historyChain">
    <span class="h-empty">단어를 클릭하면 여기에 체인이 기록됩니다</span>
  </div>
  <div class="stat-bar" id="statBar" style="display:none">
    <div class="stat-item">총 단어 <span id="statCount">0</span>개</div>
    <div class="stat-item">마지막 글자 <span id="statLast">-</span></div>
  </div>
</div>

const wordInput=document.getElementById('wordInput'),searchBtn=document.getElementById('searchBtn'),targetBar=document.getElementById('targetBar'),charPill=document.getElementById('charPill'),targetMain=document.getElementById('targetMain'),targetSub=document.getElementById('targetSub'),resultsSection=document.getElementById('resultsSection'),wordsGrid=document.getElementById('wordsGrid'),resultCount=document.getElementById('resultCount'),emptyBox=document.getElementById('emptyBox'),emptyMsg=document.getElementById('emptyMsg'),historyChain=document.getElementById('historyChain'),statBar=document.getElementById('statBar'),statCount=document.getElementById('statCount'),statLast=document.getElementById('statLast'),clearBtn=document.getElementById('clearBtn');
let history=[];

function search(){
  const raw=wordInput.value.trim();
  if(!raw)return;
  const lastChar=raw[raw.length-1];
  const words=DICT[lastChar]||[];
  targetBar.classList.add('on');
  charPill.textContent=lastChar;
  targetMain.textContent=`'${lastChar}' 로 시작하는 단어 ${words.length}개`;
  targetSub.textContent=words.length>0?'단어를 클릭하면 체인에 추가됩니다':'단어 사전에 없습니다';
  if(words.length===0){
    resultsSection.classList.remove('on');
    emptyMsg.textContent=`'${lastChar}'(으)로 시작하는 단어가 사전에 없습니다`;
    emptyBox.classList.add('on');
    return;
  }
  emptyBox.classList.remove('on');
  renderWords(words);
}

function renderWords(words){
  wordsGrid.innerHTML='';
  words.forEach(word=>{
    const chip=document.createElement('div');
    chip.className='word-chip';
    const fc=word[0],lc=word[word.length-1],mid=word.slice(1,-1),hasNext=!!DICT[lc];
    chip.innerHTML=`<span class="chip-word"><span class="fc">${fc}</span>${mid}<span class="lc">${lc}</span></span><span class="chip-next"><span class="arrow-tag">→${lc}</span>${hasNext?'<span style="color:#43e88a;font-size:10px">✓이어짐</span>':'<span style="color:#ff6b9d;font-size:10px">막힘</span>'}</span>`;
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.word-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      history.push(word);
      renderHistory();
      wordInput.value=word;
      setTimeout(search,250);
    });
    wordsGrid.appendChild(chip);
  });
  resultCount.textContent=`${words.length}개`;
  resultsSection.classList.add('on');
}

function renderHistory(){
  if(history.length===0){historyChain.innerHTML='<span class="h-empty">단어를 클릭하면 여기에 체인이 기록됩니다</span>';statBar.style.display='none';return;}
  historyChain.innerHTML=history.map((w,i)=>`<div style="display:flex;align-items:center;gap:6px"><span class="h-word">${w}</span>${i<history.length-1?'<span class="h-arrow">→</span>':''}</div>`).join('');
  statBar.style.display='flex';
  statCount.textContent=history.length;
  statLast.textContent=history[history.length-1][history[history.length-1].length-1];
}

searchBtn.addEventListener('click',search);
wordInput.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
clearBtn.addEventListener('click',()=>{history=[];renderHistory();wordInput.value='';targetBar.classList.remove('on');resultsSection.classList.remove('on');emptyBox.classList.remove('on');});
</script>
</body>
</html>
